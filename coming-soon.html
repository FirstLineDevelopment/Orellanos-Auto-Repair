<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orellano's Auto Repair | Coming Soon</title>
    <meta name="description" content="Orellano's Auto Repair. Our new website is coming soon." />
    <link rel="canonical" href="https://orellanosautorepair.com/coming-soon.html" />
    <meta property="og:title" content="Orellano's Auto Repair | Coming Soon" />
    <meta property="og:description" content="Our new website is coming soon." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://orellanosautorepair.com/coming-soon.html" />
    <meta property="og:image" content="https://orellanosautorepair.com/assets/client/Logo.png" />
    <meta property="og:image:alt" content="Orellano's Auto Repair logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f7f7f5; color: #181818; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
      main { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .masthead { width: 100%; display: flex; justify-content: space-between; gap: 20px; padding: 24px 40px; border-top: 5px solid #0968ae; border-bottom: 1px solid #dededb; font-size: 12px; font-weight: 700; text-transform: uppercase; }
      .masthead span:last-child { color: #62625e; }
      .announcement { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px 56px; }
      .logo { display: block; width: min(100%, 280px); height: auto; mix-blend-mode: multiply; }
      .eyebrow { display: flex; align-items: center; gap: 12px; margin: 28px 0 14px; color: #0968ae; font-size: 12px; font-weight: 700; text-transform: uppercase; }
      .eyebrow::before, .eyebrow::after { content: ""; width: 24px; height: 1px; background: currentColor; }
      h1 { margin: 0; font-size: 80px; font-weight: 800; line-height: 1; letter-spacing: 0; }
      .description { max-width: 380px; margin: 24px 0 0; color: #64645f; font-size: 17px; line-height: 1.6; }
      .contact { width: 100%; background: #181818; color: #fff; border-top: 4px solid #0968ae; padding: 32px 40px; text-align: left; }
      .contact-inner { max-width: 960px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      .contact h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0; }
      .contact p { margin: 0; color: #bcbcb7; font-size: 14px; line-height: 1.5; }
      .contact a { display: inline-flex; flex-direction: column; gap: 6px; padding: 8px 0; color: #fff; text-decoration: none; white-space: nowrap; }
      .contact a span { color: #80bde9; font-size: 12px; font-weight: 700; text-transform: uppercase; }
      .contact a strong { font-size: 30px; font-weight: 700; }
      .contact a:hover strong { text-decoration: underline; text-underline-offset: 6px; }
      .contact a:focus-visible { outline: 2px solid #80bde9; outline-offset: 8px; }
      @media (max-width: 600px) {
        .masthead { padding: 18px 24px; font-size: 10px; text-align: left; }
        .masthead span:last-child { text-align: right; }
        .announcement { padding: 32px 24px 40px; }
        .logo { width: 220px; }
        h1 { font-size: 48px; }
        .description { font-size: 16px; max-width: 290px; margin-top: 20px; }
        .contact { padding: 28px 24px; }
        .contact-inner { flex-direction: column; gap: 16px; text-align: center; }
        .contact h2 { font-size: 20px; }
        .contact a strong { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="masthead">
        <span>Orellano's Auto Repair</span>
        <span>Waterbury, Connecticut</span>
      </div>
      <section class="announcement" aria-labelledby="launch-title">
        <img class="logo" src="/assets/client/Logo.png" alt="Orellano's Auto Repair" />
        <p class="eyebrow">A new website is on the way</p>
        <h1 id="launch-title">Coming soon</h1>
        <p class="description">We're getting our new home online ready.<br />Your next repair doesn't have to wait.</p>
      </section>
      <section class="contact" aria-label="Contact Orellano's Auto Repair">
        <div class="contact-inner">
          <div>
            <h2>Need a hand with your vehicle?</h2>
            <p>Call us for service and availability.</p>
          </div>
          <a href="tel:+12037065687" aria-label="Call Orellano's Auto Repair at (203) 706-5687">
            <span>Let's talk</span>
            <strong>(203) 706-5687</strong>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
